<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode">
  <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
    <path fill="currentColor" d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/>
  </svg>
  <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" hidden>
    <path fill="currentColor" d="M12 4.5a1 1 0 0 1 1 1V7a1 1 0 1 1-2 0V5.5a1 1 0 0 1 1-1zm0 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm7.5-2.5a1 1 0 0 1 0 2H18a1 1 0 1 1 0-2h1.5zM6 12a1 1 0 0 1-1 1H3.5a1 1 0 1 1 0-2H5a1 1 0 0 1 1 1zm10.95 5.45a1 1 0 0 1 0 1.41l-1.06 1.06a1 1 0 1 1-1.41-1.41l1.06-1.06a1 1 0 0 1 1.41 0zM9.52 6.05a1 1 0 0 1 0 1.41L8.46 8.52A1 1 0 0 1 7.05 7.1l1.06-1.06a1 1 0 0 1 1.41 0zm8.43.05a1 1 0 0 1 0 1.41l-1.06 1.06a1 1 0 1 1-1.41-1.41l1.06-1.06a1 1 0 0 1 1.41 0zM9.52 17.95a1 1 0 0 1-1.41 0L7.05 16.9a1 1 0 0 1 1.41-1.41l1.06 1.06a1 1 0 0 1 0 1.4zM12 17a1 1 0 0 1 1 1v1.5a1 1 0 1 1-2 0V18a1 1 0 0 1 1-1z"/>
  </svg>
</button>

<script>
(function () {
  var LIGHT = "rutgers";
  var DARK = "rutgersdark";
  var KEY = "apple-blog-theme";

  function normalize(theme) {
    if (theme === DARK || theme === "dark") return DARK;
    return LIGHT;
  }

  function currentTheme() {
    try {
      var saved = window.localStorage.getItem(KEY);
      if (saved === LIGHT || saved === DARK) return saved;
    } catch (e) {}
    if (window.jtd && typeof window.jtd.getTheme === "function") {
      return normalize(window.jtd.getTheme());
    }
    return LIGHT;
  }

  function paintButton(theme) {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    var moon = btn.querySelector(".theme-toggle__icon--moon");
    var sun = btn.querySelector(".theme-toggle__icon--sun");
    var isDark = theme === DARK;
    if (moon) moon.hidden = isDark;
    if (sun) sun.hidden = !isDark;
    btn.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
    btn.setAttribute("title", isDark ? "Switch to light mode" : "Switch to dark mode");
  }

  function applyTheme(theme) {
    theme = normalize(theme);
    if (window.jtd && typeof window.jtd.setTheme === "function") {
      window.jtd.setTheme(theme);
    }
    document.documentElement.setAttribute("data-theme", theme);
    try {
      window.localStorage.setItem(KEY, theme);
    } catch (e) {}
    paintButton(theme);
  }

  window.appleBlogToggleTheme = function () {
    applyTheme(currentTheme() === DARK ? LIGHT : DARK);
  };

  document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("theme-toggle");
    if (btn) {
      btn.addEventListener("click", window.appleBlogToggleTheme);
    }
    paintButton(currentTheme());
  });
})();
</script>
