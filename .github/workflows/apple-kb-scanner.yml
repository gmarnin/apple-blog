name: Apple KB Scanner

on:
  schedule:
    # 06:00 UTC ≈ 2:00 AM Eastern (EDT)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apple-kb-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run scanner and update index.md
        run: |
          chmod +x scripts/Apple-KB-Scanner.sh scripts/update-apple-kb-index.sh
          scripts/update-apple-kb-index.sh 7

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Apple KB articles (last 7 days)"
            git push
          fi
